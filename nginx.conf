# ═══════════════════════════════════════════════════════════
# NEXUS Supply Chain Control Tower — NGINX Production Config
# Features: SSL/TLS, WebSocket proxy, rate limiting, compression,
#           security headers, upstream load balancing
# ═══════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'corr=$http_x_correlation_id';

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":"$status",'
            '"bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"upstream_time":"$upstream_response_time",'
            '"correlation_id":"$http_x_correlation_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ─── Performance ─────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    keepalive_requests  1000;
    reset_timedout_connection on;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ─── Buffers ─────────────────────────────────────────────
    client_max_body_size        50m;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 32k;
    output_buffers              1 32k;
    postpone_output             1460;

    # ─── Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/woff font/woff2;

    # ─── Rate Limiting Zones ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m        rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m       rate=10r/m;
    limit_req_zone $binary_remote_addr zone=heavy_limit:10m      rate=20r/m;
    limit_req_zone $binary_remote_addr zone=websocket_limit:10m  rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ─── Upstream Pools ──────────────────────────────────────
    upstream nexus_api {
        least_conn;
        server nexus-api:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_time 1h;
    }

    upstream nexus_frontend {
        server nexus-frontend:3000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── Security Headers Map ─────────────────────────────────
    map $sent_http_content_type $csp_header {
        ~text/html "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.mapbox.com blob:; connect-src 'self' wss: https://api.anthropic.com https://api.mapbox.com; worker-src blob:;";
        default "";
    }

    # ─── HTTP → HTTPS Redirect ────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name nexus-tower.com www.nexus-tower.com api.nexus-tower.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── API Server ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.nexus-tower.com;

        # SSL Configuration
        ssl_certificate     /etc/nginx/certs/nexus-tower.com.crt;
        ssl_certificate_key /etc/nginx/certs/nexus-tower.com.key;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;
        ssl_dhparam         /etc/nginx/certs/dhparam.pem;

        # Modern SSL — TLS 1.2+ only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Powered-By "" always;

        # CORS headers (API only)
        add_header Access-Control-Allow-Origin  "https://nexus-tower.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Correlation-ID, X-Client-Version" always;
        add_header Access-Control-Max-Age "3600" always;

        # Health check (no auth, no rate limit)
        location = /health {
            proxy_pass http://nexus_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # WebSocket — event stream
        location /ws/ {
            limit_req zone=websocket_limit burst=3 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # WebSocket timeouts
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # Auth endpoints — strict rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://nexus_api;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Correlation-ID   $request_id;
        }

        # Heavy endpoints — stricter limits
        location ~ ^/api/v1/(disruptions|agents/decision) {
            limit_req zone=heavy_limit burst=10 nodelay;

            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Connection         "";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Correlation-ID   $request_id;

            proxy_connect_timeout  10s;
            proxy_read_timeout    300s;  # Agent orchestration can take up to 3 min
            proxy_send_timeout     60s;

            # Handle OPTIONS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin  "https://nexus-tower.com";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Correlation-ID";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # General API endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID  $request_id;

            proxy_connect_timeout  5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # API docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://nexus_api;
            proxy_set_header Host $host;
        }
    }

    # ─── Frontend Server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name nexus-tower.com www.nexus-tower.com;

        ssl_certificate     /etc/nginx/certs/nexus-tower.com.crt;
        ssl_certificate_key /etc/nginx/certs/nexus-tower.com.key;
        ssl_session_cache   shared:SSL_FE:20m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_header always;
        add_header X-Powered-By "" always;

        # Static assets with aggressive caching
        location /_next/static/ {
            proxy_pass http://nexus_frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status "HIT";
            gzip_static on;
        }

        location /favicon.ico {
            proxy_pass http://nexus_frontend;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # Next.js app
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://nexus_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }
}
