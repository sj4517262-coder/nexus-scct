# ═══════════════════════════════════════════════
# NEXUS — Kubernetes Deployment Manifests
# Production-grade K8s configs with HPA, PDB,
# resource limits, health checks, and security
# ═══════════════════════════════════════════════

---
# NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/managed-by: kubectl
    environment: production

---
# ═══════════════════════════════════════════════
# API DEPLOYMENT
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app: nexus-api
    component: backend
    tier: application
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexus-api
        version: "IMAGE_TAG"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nexus-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 60
      containers:
        - name: nexus-api
          image: ghcr.io/nexus-org/nexus-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: kafka-bootstrap-servers
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: secret-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: anthropic-api-key
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: mlflow-tracking-uri
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["nexus-api"]
                topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nexus-api

---
# API SERVICE
apiVersion: v1
kind: Service
metadata:
  name: nexus-api-svc
  namespace: nexus
  labels:
    app: nexus-api
spec:
  type: ClusterIP
  selector:
    app: nexus-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# API HPA — Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-api-hpa
  namespace: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120

---
# API PDB — Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexus-api-pdb
  namespace: nexus
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nexus-api

---
# ═══════════════════════════════════════════════
# WORKER DEPLOYMENT
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-worker
  namespace: nexus
  labels:
    app: nexus-worker
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nexus-worker
  template:
    metadata:
      labels:
        app: nexus-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: nexus-worker
          image: ghcr.io/nexus-org/nexus-worker:IMAGE_TAG
          imagePullPolicy: Always
          command: ["celery", "-A", "workers.celery_app", "worker",
                    "--loglevel=info", "--concurrency=4",
                    "-Q", "default,agents,ml,notifications"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: kafka-bootstrap-servers
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: anthropic-api-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "3000m"
              memory: "8Gi"
          livenessProbe:
            exec:
              command: ["celery", "-A", "workers.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3

---
# ═══════════════════════════════════════════════
# FRONTEND DEPLOYMENT
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-frontend
  namespace: nexus
  labels:
    app: nexus-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-frontend
  template:
    metadata:
      labels:
        app: nexus-frontend
    spec:
      containers:
        - name: nexus-frontend
          image: ghcr.io/nexus-org/nexus-frontend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: api-url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-frontend-svc
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app: nexus-frontend
  ports:
    - port: 3000
      targetPort: 3000

---
# ═══════════════════════════════════════════════
# CONFIGMAP
# ═══════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  kafka-bootstrap-servers: "kafka-headless:9092"
  mlflow-tracking-uri: "http://mlflow-svc:5000"
  api-url: "https://api.nexus-tower.com"
  environment: "production"
  log-level: "INFO"
  rate-limit-per-minute: "100"
  cors-origins: "https://nexus-tower.com"

---
# ═══════════════════════════════════════════════
# INGRESS (NGINX)
# ═══════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress
  namespace: nexus
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://nexus-tower.com"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  tls:
    - hosts:
        - nexus-tower.com
        - api.nexus-tower.com
      secretName: nexus-tls-secret
  rules:
    - host: api.nexus-tower.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-api-svc
                port:
                  number: 8000
    - host: nexus-tower.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-frontend-svc
                port:
                  number: 3000

---
# ═══════════════════════════════════════════════
# SERVICE ACCOUNT & RBAC
# ═══════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-api-sa
  namespace: nexus
  labels:
    app: nexus

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-api-role
  namespace: nexus
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-api-rolebinding
  namespace: nexus
subjects:
  - kind: ServiceAccount
    name: nexus-api-sa
    namespace: nexus
roleRef:
  kind: Role
  name: nexus-api-role
  apiGroup: rbac.authorization.k8s.io
