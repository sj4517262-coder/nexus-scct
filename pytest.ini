# ═══════════════════════════════════════════════════════════
# pytest.ini — NEXUS Test Configuration
# ═══════════════════════════════════════════════════════════
[pytest]
minversion = 7.0
addopts =
    -ra
    -q
    --tb=short
    --strict-markers
    --strict-config
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=75
    --durations=20
    --no-header
    -p no:warnings

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (requires DB, Redis)
    agents: Agent orchestration tests (requires LLM API)
    ml: ML model tests (slow, requires trained models)
    load: Load testing (requires running server)
    slow: Slow tests (run separately with -m slow)
    smoke: Smoke tests for deployment validation

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    error::RuntimeWarning

# Coverage configuration
[coverage:run]
source = backend
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */venv/*
    */site-packages/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @overload
show_missing = True
skip_covered = True
